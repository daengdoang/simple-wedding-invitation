<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toý Çakylygy - Kerim & Jahan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #bfa89e;
            color: #ffffff;
            text-align: center;
        }

        /* Hero Section (1-nji sahypa) */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px 40px 20px;
            background: linear-gradient(rgba(0,0,0,0.15), rgba(0,0,0,0.15));
        }

        .title {
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
            opacity: 0.9;
        }

        .couple-names {
            font-family: 'Georgia', cursive, serif;
            font-size: 3.2rem;
            font-weight: normal;
            line-height: 1.2;
            margin: 20px 0;
        }

        .date-location {
            margin-bottom: 20px;
        }

        .wedding-date {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .wedding-venue {
            font-size: 1rem;
            opacity: 0.85;
        }

        /* Countdown Timer */
        .countdown-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            background: rgba(255, 255, 255, 0.15);
            padding: 12px 25px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-value {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .time-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* Beýleki bölümler */
        .content-section {
            background-color: #ffffff;
            color: #4a4a4a;
            padding: 50px 20px;
        }

        .bismillah {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #8c6d62;
        }

        .invitation-text {
            line-height: 1.8;
            font-size: 1rem;
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <!-- 1-NJI SAHYPA -->
    <section class="hero">
        <div class="title">Toý Çakylygy</div>
        
        <div class="couple-names">
            Kerim<br>&<br>Jahan
        </div>

        <div class="date-location">
            <div class="wedding-date">17-nji oktýabr 2026</div>
            <div class="wedding-venue">Toý Mekany | Aşgabat ş.</div>
        </div>

        <!-- YZA SANAMALY WAGT (COUNTDOWN) -->
        <div class="countdown-container">
            <div class="time-box">
                <span id="days" class="time-value">00</span>
                <span class="time-label">Gün</span>
            </div>
            <span>:</span>
            <div class="time-box">
                <span id="hours" class="time-value">00</span>
                <span class="time-label">Sagat</span>
            </div>
            <span>:</span>
            <div class="time-box">
                <span id="minutes" class="time-value">00</span>
                <span class="time-label">Min</span>
            </div>
            <span>:</span>
            <div class="time-box">
                <span id="seconds" class="time-value">00</span>
                <span class="time-label">Sek</span>
            </div>
        </div>
    </section>

    <!-- 2-NJI SAHYPA (Giriş ýazgysy) -->
    <section class="content-section">
        <div class="bismillah">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
        <div class="invitation-text">
            Mähriban dostlar we dogan-gudalar!<br><br>
            Sizi Kerim bilen Jahanyň durmuş toýy mynasybetli ýaýbaňlandyrylýan toý dabaramyza arzyly myhman bolmaga çagyrýarys.
        </div>
    </section>

    <!-- YZA SANAMAYAN JAVASCRIPT KODY -->
    <script>
        const targetDate = new Date("October 17, 2026 18:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days < 10 ? "0" + days : days;
                document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
                document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
                document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
            } else {
                document.querySelector(".countdown-container").innerHTML = "Toý güni geldi!";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
